/* ============================================================
   出毛日记 · Brand CSS
   探险家风格 — 珊瑚橙主色 + 天空蓝辅助
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

:root {
  /* ── Brand Identity ── */
  --brand-primary: #FF6B4A;
  --brand-primary-light: #FF8A6E;
  --brand-primary-dark: #E5533A;
  --brand-primary-bg: #FFF0EC;
  --brand-secondary: #4A90D9;
  --brand-secondary-light: #6BA5E3;
  --brand-secondary-bg: #EBF3FC;
  --brand-accent: #FFD93D;
  --brand-accent-dark: #F0C830;

  /* ── State Colors ── */
  --state-success: #00B894;
  --state-warning: #FDCB6E;
  --state-error: #E17055;
  --state-info: #4A90D9;

  /* ── Neutrals ── */
  --neutral-50: #FAFAFA;
  --neutral-100: #F5F5F5;
  --neutral-200: #EEEEEE;
  --neutral-300: #E0E0E0;
  --neutral-400: #BDBDBD;
  --neutral-500: #9E9E9E;
  --neutral-600: #757575;
  --neutral-700: #616161;
  --neutral-800: #424242;
  --neutral-900: #2D3436;

  /* ── Semantic Text ── */
  --text-primary: #2D3436;
  --text-secondary: #636E72;
  --text-hint: #9E9E9E;
  --text-disabled: #BDBDBD;
  --text-inverse: #FFFFFF;
  --text-link: #4A90D9;

  /* ── Semantic Backgrounds ── */
  --bg-page: #F7F8FA;
  --bg-card: #FFFFFF;
  --bg-overlay: rgba(0, 0, 0, 0.45);
  --bg-hover: #F5F5F5;
  --bg-active: #EEEEEE;

  /* ── Borders ── */
  --border-default: #E5E5E5;
  --border-light: #F0F0F0;
  --border-focus: #FF6B4A;

  /* ── Spacing Scale (4px base) ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* ── Typography Scale ── */
  --font-family: 'Noto Sans SC', 'PingFang SC', 'Helvetica Neue', sans-serif;
  --font-size-2xs: 10px;
  --font-size-xs: 12px;
  --font-size-sm: 13px;
  --font-size-base: 14px;
  --font-size-md: 15px;
  --font-size-lg: 17px;
  --font-size-xl: 20px;
  --font-size-2xl: 24px;
  --font-size-3xl: 28px;
  --font-weight-light: 300;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --line-height-tight: 1.2;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;

  /* ── Radius Scale ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Shadow (static: alpha ≤ 0.05) ── */
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.05);
  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);

  /* ── Floating Layer Shadows (alpha > 0.05 allowed) ── */
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.12);
  --shadow-sheet: 0 -4px 24px rgba(0, 0, 0, 0.1);

  /* ── Motion ── */
  --duration-fast: 150ms;
  --duration-normal: 300ms;
  --duration-slow: 500ms;
  --ease-default: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);
  --ease-out: cubic-bezier(0, 0, 0.2, 1);
  --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);

  /* ── Touch Targets ── */
  --touch-min: 44px;
  --touch-comfort: 48px;

  /* ── Z-Index Scale ── */
  --z-base: 1;
  --z-sticky: 10;
  --z-overlay: 100;
  --z-sheet: 200;
  --z-modal: 300;
  --z-toast: 400;
  --z-fab: 50;
}

/* ── Typography Utilities ── */
.font-xs { font-size: var(--font-size-xs); }
.font-sm { font-size: var(--font-size-sm); }
.font-base { font-size: var(--font-size-base); }
.font-md { font-size: var(--font-size-md); }
.font-lg { font-size: var(--font-size-lg); }
.font-xl { font-size: var(--font-size-xl); }
.font-2xl { font-size: var(--font-size-2xl); }
.font-3xl { font-size: var(--font-size-3xl); }

/* ── Color Utilities ── */
.text-primary { color: var(--text-primary); }
.text-secondary { color: var(--text-secondary); }
.text-hint { color: var(--text-hint); }
.text-brand { color: var(--brand-primary); }
.text-inverse { color: var(--text-inverse); }
.bg-page { background-color: var(--bg-page); }
.bg-card { background-color: var(--bg-card); }
.bg-brand { background-color: var(--brand-primary); }

/* ── Spacing Utilities ── */
.p-0 { padding: 0; }
.p-1 { padding: var(--space-1); }
.p-2 { padding: var(--space-2); }
.p-3 { padding: var(--space-3); }
.p-4 { padding: var(--space-4); }
.p-6 { padding: var(--space-6); }
.px-4 { padding-left: var(--space-4); padding-right: var(--space-4); }
.py-2 { padding-top: var(--space-2); padding-bottom: var(--space-2); }
.py-3 { padding-top: var(--space-3); padding-bottom: var(--space-3); }
.mt-1 { margin-top: var(--space-1); }
.mt-2 { margin-top: var(--space-2); }
.mt-3 { margin-top: var(--space-3); }
.mb-2 { margin-bottom: var(--space-2); }
.mb-3 { margin-bottom: var(--space-3); }
.mb-4 { margin-bottom: var(--space-4); }
.gap-1 { gap: var(--space-1); }
.gap-2 { gap: var(--space-2); }
.gap-3 { gap: var(--space-3); }

/* ── Radius Utilities ── */
.rounded-sm { border-radius: var(--radius-sm); }
.rounded-md { border-radius: var(--radius-md); }
.rounded-lg { border-radius: var(--radius-lg); }
.rounded-xl { border-radius: var(--radius-xl); }
.rounded-full { border-radius: var(--radius-full); }

/* ── Shadow Utilities ── */
.shadow-card { box-shadow: var(--shadow-card); }
.shadow-sm { box-shadow: var(--shadow-sm); }
.shadow-md { box-shadow: var(--shadow-md); }
.shadow-lg { box-shadow: var(--shadow-lg); }

/* ── Layout Utilities ── */
.flex { display: flex; }
.flex-col { flex-direction: column; }
.flex-center { display: flex; align-items: center; justify-content: center; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.flex-1 { flex: 1; }
.flex-shrink-0 { flex-shrink: 0; }
.flex-wrap { flex-wrap: wrap; }
.items-center { align-items: center; }
.items-start { align-items: flex-start; }
.items-end { align-items: flex-end; }
.justify-center { justify-content: center; }
.justify-between { justify-content: space-between; }
.justify-end { justify-content: flex-end; }
.w-full { width: 100%; }
.h-full { height: 100%; }
.overflow-hidden { overflow: hidden; }
.relative { position: relative; }
.absolute { position: absolute; }
.sticky { position: sticky; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ── Animation Utilities ── */
.animate-fade-in { animation: fadeIn var(--duration-normal) var(--ease-out) forwards; }
.animate-fade-up { animation: fadeUp var(--duration-normal) var(--ease-out) forwards; opacity: 0; }
.animate-bounce-in { animation: bounceIn 0.4s var(--ease-bounce) forwards; }
.animate-pulse { animation: pulse 2s ease-in-out infinite; }
.animate-scale-in { animation: scaleIn var(--duration-fast) var(--ease-out) forwards; }
.transition-all { transition: all var(--duration-fast) var(--ease-default); }
.transition-transform { transition: transform var(--duration-fast) var(--ease-default); }

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes bounceIn {
  0% { opacity: 0; transform: scale(0.3); }
  50% { transform: scale(1.05); }
  70% { transform: scale(0.9); }
  100% { opacity: 1; transform: scale(1); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

@keyframes scaleIn {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

@keyframes markerPop {
  0% { transform: scale(0) translateY(10px); }
  60% { transform: scale(1.1) translateY(-2px); }
  100% { transform: scale(1) translateY(0); }
}

/* ── Stagger Delays ── */
.stagger-1 { animation-delay: 0ms; }
.stagger-2 { animation-delay: 60ms; }
.stagger-3 { animation-delay: 120ms; }
.stagger-4 { animation-delay: 180ms; }
.stagger-5 { animation-delay: 240ms; }

/* ── Touch Feedback ── */
.press-scale { transition: transform var(--duration-fast) var(--ease-default); }
.press-scale:active { transform: scale(0.97); }
.press-opacity { transition: opacity var(--duration-fast) var(--ease-default); }
.press-opacity:active { opacity: 0.7; }

    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Phone Frame ── */
    .phone-frame {
      position: relative;
      width: 375px;
      height: 812px;
      background: #F5F5F8;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35), 0 4px 16px rgba(0,0,0,0.15);
    }

    /* ── Scrollable Content Area ── */
    .scroll-content {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 56px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .scroll-content::-webkit-scrollbar { display: none; }
    .scroll-content { -ms-overflow-style: none; scrollbar-width: none; }

    .content-inner {
      position: relative;
      width: 375px;
      min-height: 830px;
    }

    /* ── Status Bar ── */
    .status-bar {
      position: absolute;
      left: 20px;
      top: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #000000;
      letter-spacing: -0.01em;
    }

    /* ── Title ── */
    .page-title {
      position: absolute;
      left: 20px;
      top: 60px;
      font-family: 'Inter', 'Noto Sans SC', sans-serif;

      color: #000000;
      letter-spacing: -0.01em;

      width: 28px;

      background: #E88A5E;

      align-items: center;
